# Reference:
#   - https://github.com/actions/checkout
#   - https://github.com/pavelzw/pixi-diff-to-markdown
#   - https://github.com/peter-evans/create-pull-request
#   - https://github.com/prefix-dev/setup-pixi

name: ci-locks

on:
  schedule:
    # every sunday @ 00h03
    - cron: "3 0 * * 0"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

env:
  NAME: "geovista"
  SHELLOPTS: "errexit:pipefail"

permissions: {}

jobs:
  pixi-update:
    name: "pixi update"
    runs-on: "ubuntu-22.04"

    environment: development

    # the report of a failed run opens an issue, or comments on the open one
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "environment configure"
        run: |
          echo "ENV_NAME=${{ env.NAME }}" >> ${GITHUB_ENV}

      - name: "setup pixi"
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          run-install: false

      # Ask the update what moved, rather than how long the rendered summary is.
      # `pixi-diff-to-markdown` writes "No diff" for an unchanged resolution, at 8
      # bytes against a threshold of 10 -- a reworded "No changes" is 11, and the
      # guard would then fail open into a weekly empty pull-request. `.environment`
      # is empty when nothing moved and carries an entry per environment when
      # something did.
      #
      # The reader runs in an assignment, not as the condition of an `if`, which is
      # what makes `errexit` cover it: a command failing as an `if` condition is
      # exempt, so a missing interpreter would read as "nothing moved" and pass.
      #
      # pixi's messages go to the log and to "update.err" too, so that a failed
      # update can quote the error naming the environment it could not solve; with
      # "pipefail", the update's own status still decides the step.
      - name: "refresh pixi manifest"
        run: |
          pixi update --json 2>&1 > update.json | tee update.err
          moved=$(python -c "import json; print(len(json.load(open('update.json'))['environment']))" < /dev/null)
          if [ "${moved}" -gt 0 ]; then
            pixi exec pixi-diff-to-markdown < update.json > diff.md
          fi

      - name: "refresh lock and yml"
        if: ${{ hashFiles('diff.md') }}
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
        run: |
          pixi workspace export conda-explicit-spec --environment ${ENV_NAME} --frozen --ignore-pypi-errors requirements/locks
          pixi workspace export conda-environment --environment ${ENV_NAME} requirements/geovista.yml

      - name: "convert lock"
        if: ${{ hashFiles('diff.md') }}
        working-directory: requirements/locks
        run: |
          python lock2yaml.py

      - name: "create pull-request"
        id: cpr
        if: ${{ hashFiles('diff.md') }}
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ secrets.GEOVISTA_BOT_TOKEN }}
          add-paths: |
            ${{ github.workspace }}/pixi.lock
            ${{ github.workspace }}/requirements/geovista.yml
            ${{ github.workspace }}/requirements/locks/*_conda_spec.txt
            ${{ github.workspace }}/requirements/locks/*_conda_spec.yml
          commit-message: "updated manifest and lockfiles"
          branch: pixi-auto-update
          base: main
          delete-branch: true
          title: "chore: pixi manifest update"
          body-path: ${{ github.workspace }}/diff.md
          labels: |
            new: pull-request
            bot
            pixi
            skip-changelog

      - name: "show pull-request"
        if: ${{ hashFiles('diff.md') }}
        env:
          CPR_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          CPR_PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          CPR_PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          CPR_PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          echo "### :rocket: Pull-Request Summary" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}
          echo "The following locks pull-request has been auto-generated:" >> ${GITHUB_STEP_SUMMARY}
          echo "- **PR** #${CPR_PR_NUMBER}" >> ${GITHUB_STEP_SUMMARY}
          echo "- **URL** ${CPR_PR_URL}" >> ${GITHUB_STEP_SUMMARY}
          echo "- **Operation** [${CPR_PR_OPERATION}]" >> ${GITHUB_STEP_SUMMARY}
          echo "- **SHA** ${CPR_PR_HEAD_SHA}" >> ${GITHUB_STEP_SUMMARY}

      # A failed update leaves every environment's lock behind, so a failed run of
      # the schedule reports itself: an issue, or a comment on the open one, so that
      # weeks of the same failure make one issue (#2977). A run started by hand is
      # watched by whoever started it.
      - name: "report failure"
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUIDE: "https://geovista.readthedocs.io/en/latest/developer/packaging.html#gv-developer-packaging-continuous-integration"
        run: |
          title="chore: pixi lock update failure"
          {
            echo "The weekly \`pixi update\` failed, so no environment's lock moved."
            echo "Please investigate the run ${RUN_URL}"
            if [ -s update.err ]; then
              echo
              echo '```'
              grep -m 10 -e "Error" -e "─▶" update.err || true
              echo '```'
            fi
            echo
            echo "The packaging guide describes this workflow: ${GUIDE}"
          } > report.md
          number=$(gh issue list --repo "${REPO}" --state open --search "in:title \"${title}\"" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${REPO}" --body-file report.md
          else
            gh issue create --repo "${REPO}" --title "${title}" --body-file report.md --label bot --label "new: issue"
          fi
