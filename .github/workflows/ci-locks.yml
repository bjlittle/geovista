# Reference:
#   - https://github.com/actions/checkout
#   - https://github.com/pavelzw/pixi-diff-to-markdown
#   - https://github.com/peter-evans/create-pull-request
#   - https://github.com/prefix-dev/setup-pixi

name: ci-locks

on:
  schedule:
    # every sunday @ 00h03
    - cron: "3 0 * * 0"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

env:
  NAME: "geovista"
  SHELLOPTS: "errexit:pipefail"

permissions: {}

jobs:
  pixi-update:
    name: "pixi update"
    runs-on: "ubuntu-22.04"

    environment: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "environment configure"
        run: |
          echo "ENV_NAME=${{ env.NAME }}" >> ${GITHUB_ENV}

      - name: "setup pixi"
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          run-install: false

      # Ask the update what moved, rather than how long the rendered summary is.
      # `pixi-diff-to-markdown` writes "No diff" for an unchanged resolution, at 8
      # bytes against a threshold of 10 -- a reworded "No changes" is 11, and the
      # guard would then fail open into a weekly empty pull-request. `.environment`
      # is empty when nothing moved and carries an entry per environment when
      # something did.
      #
      # The reader runs in an assignment, not as the condition of an `if`, which is
      # what makes `errexit` cover it: a command failing as an `if` condition is
      # exempt, so a missing interpreter would read as "nothing moved" and pass.
      - name: "refresh pixi manifest"
        run: |
          pixi update --json > update.json
          moved=$(python -c "import json; print(len(json.load(open('update.json'))['environment']))" < /dev/null)
          if [ "${moved}" -gt 0 ]; then
            pixi exec pixi-diff-to-markdown < update.json > diff.md
          fi

      - name: "refresh lock and yml"
        if: ${{ hashFiles('diff.md') }}
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
        run: |
          pixi workspace export conda-explicit-spec --environment ${ENV_NAME} --frozen --ignore-pypi-errors requirements/locks
          pixi workspace export conda-environment --environment ${ENV_NAME} requirements/geovista.yml

      - name: "convert lock"
        if: ${{ hashFiles('diff.md') }}
        working-directory: requirements/locks
        run: |
          python lock2yaml.py

      - name: "create pull-request"
        id: cpr
        if: ${{ hashFiles('diff.md') }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GEOVISTA_BOT_TOKEN }}
          add-paths: |
            ${{ github.workspace }}/pixi.lock
            ${{ github.workspace }}/requirements/geovista.yml
            ${{ github.workspace }}/requirements/locks/*_conda_spec.txt
            ${{ github.workspace }}/requirements/locks/*_conda_spec.yml
          commit-message: "updated manifest and lockfiles"
          branch: pixi-auto-update
          base: main
          delete-branch: true
          title: "chore: pixi manifest update"
          body-path: ${{ github.workspace }}/diff.md
          labels: |
            new: pull-request
            bot
            pixi
            skip-changelog

      - name: "show pull-request"
        if: ${{ hashFiles('diff.md') }}
        env:
          CPR_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          CPR_PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          CPR_PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          CPR_PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          echo "### :rocket: Pull-Request Summary" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}
          echo "The following locks pull-request has been auto-generated:" >> ${GITHUB_STEP_SUMMARY}
          echo "- **PR** #${CPR_PR_NUMBER}" >> ${GITHUB_STEP_SUMMARY}
          echo "- **URL** ${CPR_PR_URL}" >> ${GITHUB_STEP_SUMMARY}
          echo "- **Operation** [${CPR_PR_OPERATION}]" >> ${GITHUB_STEP_SUMMARY}
          echo "- **SHA** ${CPR_PR_HEAD_SHA}" >> ${GITHUB_STEP_SUMMARY}
