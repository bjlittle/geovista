version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "latest"
  apt_packages:
    - libgl1
    - libglx-mesa0
    - xvfb
  jobs:
    # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-pixi
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    post_checkout:
      # require full history for correct setuptools-scm version discovery
      - git fetch --unshallow || true
      - git fetch --all --tags || true
    pre_install:
      # keep checkout untainted from RTD to ensure correct setuptools-scm version
      - git stash || true
    install:
      - pixi install --frozen --environment docs
    post_install:
      - git stash pop || true
    build:
      html:
        # read pages in parallel, one process per usable CPU. "nproc" counts
        # the CPUs this process may run on, as "conf.py" does for the gallery
        # workers, whereas "--jobs auto" counts every CPU on the host
        - xvfb-run -a -s "-screen 0 1024x768x24" pixi run --frozen --environment docs sphinx-build -T --jobs "$(nproc)" -b html docs/src $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/src/conf.py
  fail_on_warning: false
